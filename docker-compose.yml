# QuantSage 本地基础设施（单机一键起）
#
#   默认（T1 验收）：  docker compose up -d            → postgres / redis / redis-coord / qdrant
#   全量（T3 接 trace）：docker compose --profile observability up -d
#                                                     → 另加 Langfuse 自托管全套
#
# 所有端口只绑 127.0.0.1，不对外暴露；变量统一读仓库根 .env。
#
# 镜像固定为 `tag@sha256`：tag 供人读，digest 才是实际拉取内容。升级时**同时**改 tag 与
# digest，不要只改 tag——本地编排的可复现性靠这一条。

name: quantsage

x-langfuse-env: &langfuse-env
  # ── 服务自身 ──
  NEXTAUTH_URL: http://127.0.0.1:3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
  SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "false"
  # ── ClickHouse ──
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # ── Redis（独立实例：BullMQ 要求 noeviction，与业务缓存的 LRU 策略冲突）──
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}
  # ── 对象存储（MinIO）──
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  # ── 首次启动播种组织/项目/用户；项目 key 复用 .env 里已有的 LANGFUSE_PUBLIC_KEY/SECRET_KEY，
  #    这样 T3 切自托管只需改 LANGFUSE_BASE_URL 一行 ──
  LANGFUSE_INIT_ORG_ID: quantsage
  LANGFUSE_INIT_ORG_NAME: QuantSage
  LANGFUSE_INIT_PROJECT_ID: quantsage-p1
  LANGFUSE_INIT_PROJECT_NAME: quantsage-dev
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set LANGFUSE_PUBLIC_KEY in .env}
  LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set LANGFUSE_SECRET_KEY in .env}
  LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-dev@localhost}
  LANGFUSE_INIT_USER_NAME: dev
  LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD in .env}

services:
  # ─────────────────────────── 默认启动 ───────────────────────────

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # P4-S4 资源上限：1.25g = 512MB shared_buffers + 连接私有内存 + 余量。
    # 120 条连接来自连接预算（≤80 + Langfuse ~20 + 余量）；200 条满载会先吃穿容器内存。
    mem_limit: 1.25g
    cpus: 2.0
    # shm_size 给并行查询的 DSM 留空间；Docker 默认 64MB 在大查询上会报
    # "could not resize shared memory segment"。
    shm_size: 256mb
    # 不用 `deploy.resources`：那是 swarm 语法，compose v2 本地编排不生效。
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quantsage}
      TZ: UTC
      PGTZ: UTC
    ports:
      # 宿主 5433：本机 5432 已被 Homebrew postgresql@18 占用
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # PG18 起 PGDATA=/var/lib/postgresql/18/docker，镜像 VOLUME 上移到 /var/lib/postgresql。
      # 挂成旧的 /var/lib/postgresql/data 会让数据落进匿名卷，down -v 即丢库。
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    # P4-S4：业务缓存的**上限 + 淘汰策略**是可用性前提（E3c），不是可选优化。
    # 默认 `maxmemory=0` + `noeviction` 意味着没有上限、满了也不淘汰——缓存挂上去
    # 就是一条涨到 OOM 的曲线（实测 2026-10-16：`maxmemory=0`、`policy=noeviction`、`DBSIZE=0`）。
    # 512MB 的定标：单标的全史载荷约 1.2MB ⇒ 够放约 400 份该量级的载荷。
    # `volatile-lru` + 全部缓存键带 TTL（`cache.py` 的 `_redis_set(..., ex=...)`）：
    # 过期键可淘汰，不会把无 TTL 的键一起卷走。
    # `--save ""`：缓存可丢，关掉 RDB；否则 BGSAVE fork 的 copy-on-write 会在
    # `mem_limit` 边缘把内存瞬时翻倍（S4 实测前的隐患）。
    # `mem_limit` 比 `maxmemory` 高 128MB，留给 Redis 自身开销与客户端缓冲。
    # ⚠ `langfuse-redis` 那条**必须保持 noeviction**（BullMQ 的要求，它不能丢队列消息）——
    # 两个实例分开正是为此（见本文件顶部与 SPEC §4.6）。
    # Redis coord（共享限流）在 S5 加为独立实例（见下），与 cache 分开。
    mem_limit: 640m
    cpus: 0.5
    command:
      ["redis-server", "--save", "", "--appendonly", "no",
       "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-coord:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    # S5：共享限流专用。**noeviction**——限流键不能像缓存那样被淘汰，丢了就等于
    # 额度突然复原；128MB 足够放全部 `rl:*` 键（TTL=窗口），192m 限额留 Redis 自身开销。
    # 不做持久化：重启后额度清零是可接受的（比丢键更保守）。
    mem_limit: 192m
    cpus: 0.25
    command:
      ["redis-server", "--save", "", "--appendonly", "no",
       "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_COORD_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    # P4-S4：RSS 基线 1.8GB；2.5g 给索引/压缩留余量，不把 Docker VM 吃满。
    mem_limit: 2.5g
    cpus: 2.0
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # 该镜像无 curl/wget（实测），用 bash 的 /dev/tcp 探测
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ───────────────── monitoring profile（P4-S8，默认不启动）─────────────────
  #
  # 起法：bash scripts/dev.sh monitoring start（先把 METRICS_TOKEN / RAG_SERVICE_TOKEN
  # 写进 logs/metrics_token 与 logs/rag_token 再挂载；仓库里不落明文）。
  # 停法：bash scripts/dev.sh monitoring stop —— 只停这两个服务。**不要用 `compose down`**，
  # 它会把 postgres / redis / qdrant 一起停掉。
  # 宿主端口 9092/9093：9090/9091 已被 observability profile 的 MinIO 占用。

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["monitoring"]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - ./logs/metrics_token:/etc/prometheus/metrics_token:ro
      - ./logs/rag_token:/etc/prometheus/rag_token:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      # Linux 的 compose 需要显式映射；macOS Docker Desktop 自带，写了也无害
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    profiles: ["monitoring"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # ───────────────── observability profile（默认不启动）─────────────────

  langfuse-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}
    # 口令由容器内 shell 展开，不进宿主 argv
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    profiles: ["observability"]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: cgr.dev/chainguard/minio@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint: sh
    # 启动前先建好 langfuse bucket
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4@sha256:67f48d12a190e4ad585249c75ae1ce172b449de3dbbe7486b8179cd28e21408e
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment: *langfuse-env
    # 镜像无内置 healthcheck；首次启动含 DB/ClickHouse 迁移，约 2–3 分钟就绪。
    # 就绪判据（宿主执行）：curl -sf http://127.0.0.1:3000/api/public/health

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4@sha256:ca32a8fb2a214c7b5f42dd9c540c8072e41db659cb621f317911ce695ad6bca2
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *langfuse-env

volumes:
  pgdata:
  redisdata:
  qdrant_storage:
  prometheusdata:
  alertmanagerdata:
  langfuse_redis_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
