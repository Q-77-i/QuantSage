name: CI

# 触发：主干推送 + PR + 手动重跑。
#
# ⚠ **集成套件默认不在 CI 内**（155 项中大部分需要真容器 / 真实 `data/`——2.6GB，不进 Git /
# 真密钥），四幕可靠性演练与 MCP 握手同样不在。**例外**：配额/队列定向集成
# `tests/integration/test_quota_e2.py` 用 Postgres service 在 CI 跑（见下方 backend job）。
# **「CI 绿」不等于「全部测试通过」**，这条口径写在 `docs/specs/P3-En.md` §7.8，别在两处各讲一遍。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在跑的——省额度，也让状态只反映最新一次。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 工作流只读仓库内容：job 里不需要写 issue/PR/包，缩小 token 权限面。
permissions:
  contents: read

env:
  # ⚠ 这一条**只管解析、管不到 `--frozen` 的下载**（锁文件逐包记着清华镜像的地址）——
  # 「CI 不依赖第三方镜像」实际由后端 job 里那步 sed 承担，别把它当保证。见 SPEC §7.1。
  UV_DEFAULT_INDEX: https://pypi.org/simple
  # `uv run` **默认会同步环境**——那样会把上面 `uv sync` 明确排除掉的 torch / FlagEmbedding
  # 重新装回来（约 2GB，实测首跑让后端 job 跑了 15 分钟）。同步已经在上一步做过了，
  # 这里一律不再同步。
  UV_NO_SYNC: "1"
  # runner 默认 UTC，而本应用的展示层按**宿主时区**渲染时间（数据本身是 Asia/Shanghai）。
  # 不设这一条，四条断言「时刻渲染成 +08:00」的用例会把同一个瞬间显示成 +00:00 而红。
  # ⚠ 这只是让 CI 与部署环境一致；**应用本身没有把展示时区钉死**（见 SPEC §7.11 已知边界）。
  TZ: Asia/Shanghai
  # ── 一份**最小的假配置**（CI 没有 `.env`）────────────────────────────────
  # 这些是**配置**不是凭据，也不产生任何真实调用——等价于开发机上那份 `.env`，
  # 让应用走正常路径而不是降级路径。缺了它们的后果是静默降级，表现很偏：
  #   * 缺 `JWT_SECRET` ⇒ 鉴权端点先撞 `auth.py` 的「鉴权未配置」→ **503 而不是 401**
  #     （10 条断言未登录即 401 的用例因此全红）
  #   * 缺 `XIAOSHI_*` ⇒ `adapter_connection()` 抛 `XiaoshiNotInstalled`（1 条读超时用例）
  #   * 缺 `DEEPSEEK_API_KEY` ⇒ 角色降级成 `LLMNotConfigured`，盖住了用例真正要验的
  #     「熔断」文案（1 条）
  # `/bin/true` 只作占位：用例只检查它进了连接参数，**不会真的执行**。⚠ 但 `xiaoshi.py`
  # 会校验它**存在且可执行**（`is_file()` + `X_OK`），所以不能随手编一个路径——
  # `/bin/true` 在 Ubuntu 上稳（`/bin` 是 `/usr/bin` 的软链）；本机是 macOS 时对应
  # `/usr/bin/true`，本地复现 CI 条件时要跟着换。
  JWT_SECRET: ci-dummy-secret-not-a-real-key-0123456789
  XIAOSHI_API_KEY: ci-dummy
  XIAOSHI_MCP_COMMAND: /bin/true
  XIAOSHI_CLI_COMMAND: /bin/true
  DEEPSEEK_API_KEY: ci-dummy

# runner 镜像钉 LTS：2026-10-29 `ubuntu-latest` 漂到 26.04（resolute），同一份代码在
# 该镜像上 bwrap 执行 `.venv/bin/python` 报 ENOENT（24.04/noble 绿）；先钉 noble，升级另开。
jobs:
  backend:
    name: 后端 · ruff + pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # 配额/队列定向集成需要真 Postgres；这是 P1 起 CI 唯一跑的真实依赖集成。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quantsage
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: quantsage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantsage -d quantsage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      # 用户策略沙箱（安全修复）：生产默认 STRATEGY_ISOLATION=require；CI 装 bwrap，
      # 让 Linux 隔离路径**真的跑起来**（tests/conftest.py 设的是 auto，有 bwrap 就用）。
      # ubuntu-latest 默认限制非特权 user namespace（AppArmor）；放开它以便 bwrap 能在
      # runner 里创建命名空间。旧内核没有该 sysctl 时忽略（preflight 会给出真实结论）。
      - name: 安装 bubblewrap（用户策略沙箱）
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --ro-bind / / --unshare-all --die-with-parent true
      # **锁文件里的主机名换成官方 PyPI**：`uv.lock` 逐包记着清华镜像的下载地址（1206 处），
      # 而 `UV_DEFAULT_INDEX` 只管解析、管不到 `--frozen` 的下载 ⇒ 不换的话 CI 是靠第三方镜像
      # 在装依赖，镜像一抖就红（2026-10-17 实测红过一次：nvidia-cufile 403，与当次提交无关）。
      # 纯主机名替换，文件字节不变 ⇒ 锁里的 sha256 照样对得上；官方对 /packages/… 返
      # 301 → files.pythonhosted.org，uv 跟随重定向（实测）。见 SPEC §7.1。
      - name: 锁文件索引改指官方 PyPI（不依赖第三方镜像）
        run: sed -i 's|pypi.tuna.tsinghua.edu.cn|pypi.org|g' uv.lock
      # torch / FlagEmbedding **不装**：离线套件实测完全不需要它们（用 import hook 屏蔽二者后
      # 全绿；`app/` 全仓零模块级 torch 导入）。省约 2GB 与数分钟，`uv.lock` 本身不动。
      - name: 装依赖
        run: uv sync --frozen --no-install-package torch --no-install-package FlagEmbedding
      - name: lint
        run: uv run ruff check .
      # 覆盖率闸门（P2）：一次跑出分支数据，但**按行覆盖**判——
      # `check_coverage.py` 守全局 88% + 核心模块底线（见 SPEC §7.3）。
      # 不把 `--cov-branch` 的综合 87.57% 变成闸门：那等于把门槛悄悄降到 87。
      # 88 是 2026-10-15 按 CI 基线 89.36% 取整下浮的历史定标；P2 收尾复测行覆盖 89.34%，
      # 余量约 1.34 点；改任何数字都等于改闸门宽度，要在 SPEC 留痕。
      # `term-missing:skip-covered` 而非默认 `term`：只列**未满 100% 的文件与缺行号**
      # （满覆盖的约 44 个不打印），日志即诊断——排查平台差异时靠它定位缺口行，
      # 平时看日志也直接知道哪没测到。
      - name: 测试
        run: |
          uv run pytest -q --cov=app --cov-branch --cov-report=json:coverage.json --cov-report=term-missing:skip-covered
          uv run python scripts/check_coverage.py coverage.json
      # P1：槽位/计数守卫、并发准入、幂等重放这些语义只有真 SQL 能验。
      # 只跑配额/队列定向文件；需要真实 data/ 的 paper/research 集成仍不在 CI。
      - name: 配额/队列定向集成（真 Postgres）
        env:
          DATABASE_URL: postgresql://quantsage:ci@localhost:5432/quantsage
          API_WORKERS: "1"
          METRICS_TOKEN: ""
          RATE_LIMIT_SHARED: "false"
        run: uv run pytest tests/integration/test_quota_e2.py -q -m integration

  frontend:
    name: 前端 · lint + typecheck + test + build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # `build` 会先跑 `sync-monaco.mjs`（把 monaco 产物拷进 `public/`），无外部依赖。
      - run: pnpm build

  prometheus:
    name: Prometheus 规则 · promtool
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # P2 T12：规则文件不再只靠手动 docker run；check 验语法，test 验阈值逻辑。
      - name: promtool check/test
        run: |
          docker run --rm -v "$PWD/docker/prometheus/rules:/p:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.15.1 check rules /p/quantsage.yml
          docker run --rm -v "$PWD/docker/prometheus/rules:/p:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.15.1 test rules /p/quantsage_test.yml

  audit:
    name: 供应链审计
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # 前端那一步要跑 `pnpm audit`——**runner 上没有 pnpm**，不装就是 exit 127
      # （首跑就是这么红的）。这里不跑前端构建，所以不需要 setup-node 的缓存。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # 审**清单**而不是本地已装的包：CI 跳装了 torch，`--path` 会让它成为审计盲区。
      # `--no-hashes` 是必需的——带 hash 的清单与 pip 解析结果比对会失败（E8a 踩过，SPEC §7.4）。
      - name: 后端依赖审计
        working-directory: backend
        run: |
          # 2026-10-27 窄口径例外：LiteLLM 直到 1.106.4 都硬约束 filelock<4.0，
          # 而审计要求的修复版是 4.2.1，装不上。只忽略这 3 条，其余照常；
          # LiteLLM 放开 filelock<4.0 后删除这三行并升级 filelock。
          uv export --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          # 2026-10-29 新增 10 条 filelock CVE（LiteLLM 1.106.6 仍 filelock<4.0）；
          # 与上面三条同属一个窄口径例外，LiteLLM 放开后一起删。
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/req.txt" --strict \
            --ignore-vuln CVE-2026-112940 \
            --ignore-vuln CVE-2026-112913 \
            --ignore-vuln CVE-2026-112907 \
            --ignore-vuln CVE-2026-112908 \
            --ignore-vuln CVE-2026-112909 \
            --ignore-vuln CVE-2026-112910 \
            --ignore-vuln CVE-2026-112911 \
            --ignore-vuln CVE-2026-112912 \
            --ignore-vuln CVE-2026-112915 \
            --ignore-vuln CVE-2026-112935 \
            --ignore-vuln CVE-2026-112936 \
            --ignore-vuln CVE-2026-112938 \
            --ignore-vuln CVE-2026-112939
      # 例外清单在 `frontend/pnpm-workspace.yaml` 的 `auditConfig.ignoreGhsas` 里（目前只有
      # `braces` 一条：**上游无补丁可升**，路径是 shadcn CLI 的构建期 glob 工具链、运行时不加载
      # ——SPEC §8.4 已如实记录，这里不假装已解决）。**例外入库而不是写在命令里**：跟着代码
      # 评审走，CI 与本地跑的是同一份口径；上游出补丁即从配置里删掉那条。
      # 例外之外的高危一律失败。
      - name: 前端依赖审计
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
