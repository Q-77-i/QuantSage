# QuantSage Prometheus（P4-S8）：默认不启动，`bash scripts/dev.sh monitoring start` 起。
#
# 两个抓取目标都在**宿主机回环**上（uvicorn / RAG 只绑 127.0.0.1）；Docker Desktop 的
# `host.docker.internal` 已实测可达 8000/8200。token 文件由 dev.sh 从 .env 写入
# `logs/`，这里只读挂载——仓库里不落明文。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/quantsage.yml

# 告警必须显式指到 Alertmanager，否则规则只在 Prometheus UI 里亮红、不会外发。
# 两个容器同属 compose 默认网络，用服务名即可。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: quantsage-api
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: quantsage-rag
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/rag_token
    static_configs:
      - targets: ["host.docker.internal:8200"]
