[project]
name = "quantsage-backend"
version = "0.1.0"
description = "QuantSage 后端：FastAPI + LangGraph，前视偏差为零的 AI 投研 Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── 安全红线：checkpoint 与编排链显式 pin，防 `uv lock --upgrade` 静默漂移（CLAUDE.md §五）──
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langchain-mcp-adapters==0.3.2",
    # langchain 1.x 不含 LiteLLM 集成，须显式装桥接包；T3 起 LLM 调用走它
    "langchain-litellm==0.11.0",
    # 适配器要求 mcp>=1.24,<2；上游已到 2.x，必须钉住
    "mcp==1.30.0",
    # checkpoint-postgres 只声明裸 psycopg，binary extra 需自行添加（否则走源码编译）
    # M7d：研报 PDF 导出走服务端渲染；用 channel="chrome" 复用本机浏览器，不额外下载
    "playwright==1.63.0",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    # ── 运行期 ──
    "fastapi~=0.142.2",
    "uvicorn[standard]~=0.54.0",
    "pydantic~=2.13.5",
    "pydantic-settings~=2.15.0",
    "litellm~=1.104.0",
    "langfuse~=4.16.0",
    "duckdb~=1.5.6",
    "pyarrow~=25.0.1",
    "httpx~=0.28",
    # ── 鉴权（M1）：与 checkpoint 链同等对待，显式 pin ──
    # 不引 passlib：对 bcrypt 4.x 有 __about__ 告警且维护停滞；不引 python-jose（PyJWT 更轻）
    "bcrypt==5.0.0",
    "pyjwt==2.15.1",
    "apscheduler>=3.11.3",
    # ── RAG（M3）：向量库客户端与服务端 v1.19.1 对齐（RrfQuery 的自定义 k 需 ≥1.16）──
    "qdrant-client~=1.19.1",
    # 嵌入与精排走 BAAI 官方实现。**fastembed（ONNX）路线经 spike 实测否决**：
    # 它到 0.8.1（PyPI 最新）仍不支持 BAAI/bge-m3（dense 与 sparse 都不在支持列表），
    # reranker 列表里也没有 bge-reranker-v2-m3（见 SPEC §4 M3a）。
    # 版本按 spike 实测通过的那一版钉住（macOS arm64，无 CUDA）。
    "FlagEmbedding==1.4.2",
    "torch==2.14.1",
    "redis==7.1.0",
    "prometheus-client~=0.26",
]

[dependency-groups]
dev = [
    "exchange-calendars>=4.13.2",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    # E7b：覆盖率（CI 里是闸门，`--cov-fail-under`）。与 ruff 同理精确 pin——
    # 新版本可能改变统计口径，等于悄悄挪动闸门。
    "pytest-cov==7.0.0",
    # E7：lint。**精确 pin**——新版本会引入新规则，等于悄悄放宽或收紧 CI 闸门
    #（放宽则漏检，收紧则突然变红），升级必须是显式动作。
    "ruff==0.17.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 默认只跑离线单测；`pytest -m integration` 触发需要容器/网络/密钥的用例
addopts = '-m "not integration" --strict-markers'
markers = [
    # **真实数据**也是一维（2026-10-15 E7a 补）：`data/` 不进 Git，CI 上没有它——
    # 凡是要读真实行情/语料才成立的用例都归这一档，别让它们赖在离线轨里。
    # ⚠ `-m "not integration"` 只是**不选中**，pytest **仍会 import 模块**：
    # 模块级读数据的代码必须在 import 期就避开（否则整个收集阶段崩，exit 2）。
    "integration: 需要容器 / 真实数据 / 真实网络 / 真实密钥，默认不跑",
]

# ── E7：lint（`uv run ruff check .`，CI 里是闸门）────────────────────────────
# 三条口径都是**实测定的**，改它们等于改闸门宽度（SPEC §7.2）：
[tool.ruff]
target-version = "py312"
# 默认 88 字符在本仓出 2654 条 E501（中英混排的长注释/docstring 多）；
# 实测 100→457、120→32、140→9。取 120：是个站得住的通用标准，存量也修得完。
line-length = 120
# **模板是数据不是模块**：`templates/` 下五份源码文本由沙箱执行，`Signal`/`Side`
# 靠运行时注入——lint 它们必然报 F821（实测 21 条 F821 里 20 条出在这里）。
exclude = ["app/strategy/templates"]

[tool.ruff.lint]
# 中等集：正确性（E/F）+ 导入序（I）+ 现代化（UP）+ 易错模式（B/SIM）。
# **刻意不吃默认**——ruff 0.17 的默认集在本仓出 467 条，其中 164 条 RUF100、
# 72 条 B008，噪声大于信号。
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
extend-ignore = [
    # FastAPI 的 `Depends()`/`Query()` 就该写在默认参数里，这是框架惯用法不是缺陷。
    # 全仓写法一致、无例外价值，故整条规则关掉而非逐处 noqa（宽集下 72 条）。
    "B008",
]

# ── E7b：覆盖率（CI 里是闸门，`--cov=app --cov-fail-under`）──────────────────
# 读数与门槛的实测记录见 SPEC §7.3。**默认不加进 `addopts`**：本地跑测试不必每次
# 付插桩的代价，要看覆盖率显式传 `--cov=app`。
[tool.coverage.run]
# 被测范围由命令行 `--cov=app` 指定（CI 与本地用同一条），配置里不再重复声明 source。
# 「模板是数据不是模块」（同上面 ruff 的 exclude）：`templates/` 下五份源码文本由沙箱
# 子进程执行、靠运行时注入 `Signal`/`Side`，主进程从不 import 它们——算进来就是六个
# 恒 0% 的文件（244 条语句），结构性拉低读数，不是覆盖率缺口。
omit = ["*/templates/*"]
